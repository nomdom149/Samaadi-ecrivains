<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Cette page ne doit PAS être indexée -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">

  <title>Samaâdi — Accès privé</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">

  <style>
    /* Styles spécifiques à la page de login */

    body {
      background: var(--charcoal-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrap {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: var(--space-6);
    }

    .login-card {
      background: var(--chene);
      padding: var(--space-16) var(--space-12);
      position: relative;
      text-align: center;
    }

    /* Cadre doré */
    .login-card::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(201, 162, 39, 0.2);
      pointer-events: none;
    }

    .login-logo {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 400;
      font-style: italic;
      color: var(--cream);
      margin-bottom: var(--space-2);
    }

    .login-sub {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: var(--space-12);
    }

    .login-divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--miel), transparent);
      margin: 0 auto var(--space-12);
    }

    .login-form {
      text-align: left;
      position: relative;
      z-index: 1;
    }

    .login-field {
      margin-bottom: var(--space-5);
    }

    .login-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: var(--space-2);
    }

    .login-input {
      width: 100%;
      background: rgba(250, 247, 242, 0.06);
      border: 1px solid rgba(201, 162, 39, 0.2);
      border-radius: 0;
      padding: var(--space-4) var(--space-5);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 400;
      color: var(--cream);
      outline: none;
      transition: border-color var(--duration-fast) var(--ease-out),
                  background var(--duration-fast) var(--ease-out);
      -webkit-appearance: none;
    }

    .login-input::placeholder {
      color: rgba(250, 247, 242, 0.25);
      font-size: 14px;
    }

    .login-input:focus {
      border-color: rgba(201, 162, 39, 0.5);
      background: rgba(250, 247, 242, 0.08);
    }

    .login-btn {
      width: 100%;
      margin-top: var(--space-8);
      background: var(--amber);
      border: none;
      padding: var(--space-5) var(--space-8);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cream);
      cursor: pointer;
      transition: background var(--duration-fast) var(--ease-out),
                  transform var(--duration-fast) var(--ease-out);
    }

    .login-btn:hover {
      background: var(--amber-light);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-error {
      display: none;
      margin-top: var(--space-5);
      padding: var(--space-3) var(--space-4);
      background: rgba(200, 50, 50, 0.1);
      border: 1px solid rgba(200, 50, 50, 0.2);
      font-size: 12px;
      color: rgba(255, 180, 160, 0.9);
      text-align: center;
      letter-spacing: 0.04em;
    }

    .login-error.visible {
      display: block;
    }

    .login-back {
      display: block;
      text-align: center;
      margin-top: var(--space-8);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(250, 247, 242, 0.3);
      transition: color var(--duration-fast) var(--ease-out);
    }

    .login-back:hover {
      color: rgba(250, 247, 242, 0.6);
    }

    /* Page protégée (cachée jusqu'à l'auth) */
    #protected-content {
      display: none;
    }
  </style>
</head>
<body>

  <!-- ── Formulaire de connexion ── -->
  <div class="login-wrap" id="login-section" role="main" aria-label="Connexion espace privé">
    <div class="login-card">
      <p class="login-logo">Samaâdi</p>
      <p class="login-sub">Espace privé</p>
      <div class="login-divider"></div>

      <form class="login-form" id="login-form" novalidate>
        <div class="login-field">
          <label class="login-label" for="field-user">Identifiant</label>
          <input
            class="login-input"
            type="text"
            id="field-user"
            name="username"
            autocomplete="username"
            placeholder="Votre identifiant"
            required
          >
        </div>

        <div class="login-field">
          <label class="login-label" for="field-pass">Mot de passe</label>
          <input
            class="login-input"
            type="password"
            id="field-pass"
            name="password"
            autocomplete="current-password"
            placeholder="Votre mot de passe"
            required
          >
        </div>

        <button type="submit" class="login-btn">Entrer</button>

        <div class="login-error" id="login-error" role="alert" aria-live="polite">
          Identifiant ou mot de passe incorrect.
        </div>
      </form>
    </div>

    <a href="/" class="login-back">← Retour à la maison</a>
  </div>


  <!-- ── Contenu protégé (chargé après auth réussie) ── -->
  <div id="protected-content">
    <!-- Le contenu de la page de réservation sera injecté ici -->
    <!-- Ou redirigé vers reservation.html après validation -->
  </div>


  <script>
    'use strict';

    /*
     * AUTHENTIFICATION CÔTÉ CLIENT
     *
     * Les identifiants sont stockés en hash SHA-256.
     * Pour générer un nouveau hash :
     *   console.log(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('votre_mot_de_passe'))
     *     .then(b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('')))
     *
     * Les credentials ci-dessous sont des EXEMPLES — à remplacer avant mise en ligne.
     * Chaque accès est unique : un objet par invité.
     */

    const CREDENTIALS = [
      /*
       * Format :
       * {
       *   user: "hash SHA-256 de l'identifiant",
       *   pass: "hash SHA-256 du mot de passe",
       *   redirect: "url vers laquelle rediriger après auth"
       * }
       *
       * Exemple (à ne PAS utiliser en production — générez vos propres hash) :
       * {
       *   user: "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3",  // "123"
       *   pass: "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f",  // "password"
       *   redirect: "../reservation/"
       * }
       */
    ];

    async function hashString(str) {
      const msgBuffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function tryLogin(username, password) {
      const userHash = await hashString(username.trim().toLowerCase());
      const passHash = await hashString(password);

      for (const cred of CREDENTIALS) {
        if (cred.user === userHash && cred.pass === passHash) {
          return cred.redirect || '../reservation/';
        }
      }
      return null;
    }

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = document.getElementById('field-user').value;
      const password = document.getElementById('field-pass').value;
      const errorEl = document.getElementById('login-error');

      if (!username || !password) {
        errorEl.classList.add('visible');
        return;
      }

      const redirect = await tryLogin(username, password);

      if (redirect) {
        errorEl.classList.remove('visible');
        // Mémorise la session (sessionStorage — effacé à la fermeture de l'onglet)
        sessionStorage.setItem('samaadi_auth', '1');
        window.location.href = redirect;
      } else {
        errorEl.classList.add('visible');
        document.getElementById('field-pass').value = '';
        document.getElementById('field-pass').focus();
      }
    });

    // Masque l'erreur quand l'utilisateur retape
    ['field-user', 'field-pass'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', function () {
        document.getElementById('login-error').classList.remove('visible');
      });
    });
  </script>

</body>
</html>
